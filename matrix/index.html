  <script>
    window.__matrixErrors = [];
    window.addEventListener("error", function (event) {
      var detail = (event.message || "Erreur JavaScript") + " @ " + (event.lineno || "?") + ":" + (event.colno || "?");
      window.__matrixErrors.push(detail);
      document.documentElement.setAttribute("data-js-error", window.__matrixErrors.join(" | "));
    });
    window.addEventListener("unhandledrejection", function (event) {
      var reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || "Promesse rejetée");
      document.documentElement.setAttribute("data-js-error", "Promesse rejetée : " + reason);
    });
  </script>

<script>
"use strict";
const APP_VERSION="0.1.0",SCHEMA_VERSION=1,CATALOG_VERSION=1;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const now=()=>new Date().toISOString();
const uid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:r&3|8).toString(16)});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm=v=>String(v??"").trim().toLocaleLowerCase("fr");
const clone=v=>structuredClone?structuredClone(v):JSON.parse(JSON.stringify(v));
const BUILTIN_TYPES=["PC","Serveur","Tablette","Switch","Routeur","Pare-Feux","Chiffreur"];
const PORTS=[[20,"TCP","FTP données"],[21,"TCP","FTP contrôle"],[22,"TCP","SSH"],[23,"TCP","Telnet"],[25,"TCP","SMTP"],[53,"TCP","DNS"],[53,"UDP","DNS"],[67,"UDP","DHCP serveur"],[68,"UDP","DHCP client"],[69,"UDP","TFTP"],[80,"TCP","HTTP"],[110,"TCP","POP3"],[123,"UDP","NTP"],[143,"TCP","IMAP"],[161,"UDP","SNMP"],[162,"UDP","SNMP Trap"],[389,"TCP","LDAP"],[389,"UDP","LDAP"],[443,"TCP","HTTPS"],[445,"TCP","SMB"],[465,"TCP","SMTPS"],[636,"TCP","LDAPS"],[993,"TCP","IMAPS"],[995,"TCP","POP3S"],[1433,"TCP","Microsoft SQL Server"],[1434,"UDP","Microsoft SQL Server"],[1521,"TCP","Oracle"],[3306,"TCP","MySQL"],[3389,"TCP","RDP"],[3389,"UDP","RDP"],[5432,"TCP","PostgreSQL"],[5900,"TCP","VNC"],[5985,"TCP","WinRM HTTP"],[5986,"TCP","WinRM HTTPS"],[6379,"TCP","Redis"]];
function builtins(){
  const equipmentTypes=BUILTIN_TYPES.map(name=>({id:"builtin:type:"+norm(name),canonicalId:"type:"+norm(name),name,description:"",builtin:true}));
  const protocols=["TCP","UDP"].map(name=>({id:"builtin:protocol:"+name.toLowerCase(),canonicalId:"protocol:"+name.toLowerCase(),name,description:"Protocole de transport",builtin:true}));
  const pids=Object.fromEntries(protocols.map(p=>[p.name,p.id]));
  const knownPorts=PORTS.map(([number,proto,name])=>({id:`builtin:port:${proto.toLowerCase()}:${number}`,canonicalId:`port:${proto.toLowerCase()}:${number}`,number,protocolId:pids[proto],name,aliases:[],description:"",builtin:true}));
  return{equipmentTypes,protocols,knownPorts};
}
function newDocument(){
  const b=builtins(),t=now();
  return{schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,catalogVersion:CATALOG_VERSION,document:{id:uid(),name:"Nouveau document",revision:0,parentHash:null,createdAt:t,updatedAt:t},users:[],zones:[],vlans:[],equipmentTypes:b.equipmentTypes,serviceTypes:[],protocols:b.protocols,knownPorts:b.knownPorts,equipments:[],services:[],flows:[],positions:{desktop:{},tablet:{},phone:{}}};
}
let state=newDocument(),currentView="dashboard",currentUserId=null,undoState=null,fileHandle=null,lastExternal=null,dirty=true,filterText="";
const mapFilters={zoneId:"",equipmentId:"",serviceId:"",protocolId:"",status:"",flowState:""};
const statusValues=["ONLINE","OFFLINE","PENDING","CRASHED"];
function currentUser(){return state.users.find(x=>x.id===currentUserId)||null}
function userPseudo(){return currentUser()?.pseudo||"non renseigné"}
function entityMeta(item){const t=now();return Object.assign(item,{id:item.id||uid(),createdAt:item.createdAt||t,updatedAt:t})}
function freshEntity(item){const copy=clone(item),t=now();copy.id=uid();copy.createdAt=t;copy.updatedAt=t;return copy}
function transact(label,fn,{destructive=false}={}){
  const before=clone(state);
  try{fn();state.document.revision++;state.document.parentHash=hashText(JSON.stringify(before));state.document.updatedAt=now();dirty=true;if(destructive)undoState={label,state:before};scheduleRecovery();render();setSave("Non sauvegardé");toast(label,"ok")}
  catch(e){state=before;toast(e.message||String(e),"error");throw e}
}
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return("00000000"+(h>>>0).toString(16)).slice(-8)}
function ensureUnique(list,name,except=null,scope=()=>true,msg="Ce nom existe déjà."){if(list.some(x=>x.id!==except&&scope(x)&&norm(x.name)===norm(name)))throw Error(msg)}
function badge(v){return`<span class="badge ${esc(v)}"><span class="dot"></span>${esc(v)}</span>`}
function ref(list,id){return list.find(x=>x.id===id)}
function equip(id){return ref(state.equipments,id)}
function service(id){return ref(state.services,id)}
function zone(id){return ref(state.zones,id)}
function protocol(id){return ref(state.protocols,id)}
function interfacesOf(eid){return equip(eid)?.interfaces||[]}
function serviceName(id){const s=service(id);return s?`${s.name} — ${equip(s.equipmentId)?.name||"?"}`:"À compléter"}
function networkRefs(eid){
  const out=[];for(const i of interfacesOf(eid)){out.push({kind:"interface",refId:i.id,label:`Interface · ${i.name}`});for(const ip of i.ips)out.push({kind:ip.family===4?"ipv4":"ipv6",refId:ip.id,label:`${ip.family===4?"IPv4":"IPv6"} · ${ip.address}`});for(const d of i.dns)out.push({kind:"dns",refId:d.id,label:`DNS · ${d.name}`})}return out
}
function listenerOptions(eid,listeners=[]){const selected=new Set(listeners.map(l=>`${l.kind}:${l.refId}`));return networkRefs(eid).map(r=>`<option value="${r.kind}:${r.refId}" ${selected.has(`${r.kind}:${r.refId}`)?"selected":""}>${esc(r.label)}</option>`).join("")}
function serviceListenerOptions(serviceId,selected){const s=service(serviceId);return`<option value="">Non renseigné</option>`+(s?.listeners||[]).map(l=>{const r=networkRefs(s.equipmentId).find(x=>x.refId===l.refId);return`<option value="${l.id}" ${l.id===selected?"selected":""}>${esc(r?.label||"Point d'écoute")}</option>`}).join("")}
function invalidateListeners(listenerIds,reason="point d'écoute supprimé"){
  const ids=new Set(listenerIds);if(!ids.size)return;
  state.flows.forEach(f=>f.endpoints.forEach(ep=>{if(ids.has(ep.listenerId)){ep.listenerId=null;f.anomalies=[...new Set([...(f.anomalies||[]),reason])];f.updatedAt=now()}}));
}
function removeNetworkReferences(refIds,reason="point d'écoute supprimé"){
  const refs=new Set(refIds),removed=[];
  state.services.forEach(s=>{const gone=s.listeners.filter(l=>refs.has(l.refId));removed.push(...gone.map(l=>l.id));if(gone.length){s.listeners=s.listeners.filter(l=>!refs.has(l.refId));s.updatedAt=now()}});
  invalidateListeners(removed,reason);return removed;
}
function toast(message,type=""){const n=document.createElement("div");n.className="toast "+type;n.textContent=message;$("#toasts").append(n);setTimeout(()=>n.remove(),4200)}
function setSave(v){$("#saveState").textContent=v}
function fmtDate(v){try{return new Intl.DateTimeFormat("fr-FR",{dateStyle:"short",timeStyle:"short"}).format(new Date(v))}catch{return v}}
function options(list,value,label=x=>x.name,empty="— Sélectionner —"){return`<option value="">${esc(empty)}</option>`+list.map(x=>`<option value="${x.id}" ${x.id===value?"selected":""}>${esc(label(x))}</option>`).join("")}
function modal(title,body,onSubmit,{submit="Enregistrer",hideSubmit=false}={}){
  const d=$("#modal"),f=$("#modalForm");$("#modalTitle").textContent=title;$("#modalBody").innerHTML=body;$("#modalSubmit").textContent=submit;$("#modalSubmit").classList.toggle("hidden",hideSubmit);
  $$('[value="cancel"]',d).forEach(b=>b.classList.remove("hidden"));
  f.onsubmit=e=>{e.preventDefault();if(e.submitter?.value==="cancel"){d.close();return}try{onSubmit?.(new FormData(f),f);d.close()}catch(err){showModalError(err.message||String(err))}};
  d.showModal();setTimeout(()=>$(".modalbody input,.modalbody select,.modalbody button")?.focus(),20);
}
function showModalError(msg){let b=$(".errorbox",$("#modalBody"));if(!b){b=document.createElement("div");b.className="errorbox";$("#modalBody").prepend(b)}b.textContent=msg}
function confirmAction(title,message,onYes){modal(title,`<p>${message}</p>`,()=>onYes(),{submit:"Confirmer"})}
function historyEntry(oldStatus,newStatus,reason=""){return entityMeta({oldStatus:oldStatus||null,newStatus,pseudo:userPseudo(),reason,originDocumentUUID:state.document.id,occurredAt:now()})}
function setView(name){currentView=name;$$("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));$$(".view").forEach(v=>v.classList.toggle("active",v.id==="view-"+name));renderView(name)}
function render(){$("#docName").value=state.document.name;$("#userButton").textContent=currentUser()?`♙ ${currentUser().pseudo}`:"♙ Utilisateur…";renderView(currentView)}
function renderView(v){({dashboard:renderDashboard,equipments:renderEquipments,services:renderServices,flows:renderFlows,map:renderMap,references:renderReferences,users:renderUsers,data:renderData}[v]||(()=>{}))()}
function viewHeader(title,actions=""){return`<div class="viewhead"><h1>${title}</h1><div class="actions">${actions}</div></div>`}
function matches(...values){if(!filterText)return true;const q=norm(filterText);return values.some(v=>norm(v).includes(q))}
function renderDashboard(){
  const root=$("#view-dashboard"),ok=state.flows.filter(f=>flowState(f)==="OK").length,draft=state.flows.length-ok;
  root.innerHTML=viewHeader("Tableau de bord")+`<div class="grid">
  <div class="card stat"><span class="muted">Équipements</span><strong>${state.equipments.length}</strong></div>
  <div class="card stat"><span class="muted">Services</span><strong>${state.services.length}</strong></div>
  <div class="card stat"><span class="muted">Flux OK</span><strong>${ok}</strong></div>
  <div class="card stat"><span class="muted">Flux DRAFT</span><strong>${draft}</strong></div>
  <div class="card span2"><h2>État du document</h2><p><b>${esc(state.document.name)}</b></p><p class="muted">UUID ${esc(state.document.id)}<br>Révision ${state.document.revision} · ${fmtDate(state.document.updatedAt)}</p>${undoState?`<button class="btn" data-action="undo">Annuler : ${esc(undoState.label)}</button>`:""}</div>
  <div class="card span2"><h2>Alertes</h2>${draft?`<p>${draft} flux restent à compléter.</p>`:"<p>Aucun flux en brouillon.</p>"}${!state.zones.length?"<p>Créez une zone avant d'ajouter un équipement.</p>":""}${!state.users.length?"<p>Créez un utilisateur pour assurer la traçabilité.</p>":""}</div></div>`;
  $('[data-action="undo"]',root)?.addEventListener("click",undoLast);
}
function toolbar(addLabel){return`<div class="toolbar"><input class="search" type="search" value="${esc(filterText)}" placeholder="Rechercher…" aria-label="Rechercher"><button class="btn primary" data-action="add">${addLabel}</button></div>`}
function bindSearch(root){$(".search",root)?.addEventListener("input",e=>{filterText=e.target.value;renderView(currentView)})}

  for(const key of ["zones","vlans","equipmentTypes","serviceTypes","protocols","knownPorts","users","equipments","services","flows"]){
    const current=new Map(state[key].map(x=>[x.id,x])),keep=[];
    for(const incoming of prepared[key]){const existing=current.get(incoming.id);if(!existing)keep.push(incoming);else if(JSON.stringify(mergeComparable(existing))!==JSON.stringify(mergeComparable(incoming))){conflicts.push({key,id:incoming.id,current:existing,incoming});keep.push(incoming)}}
    prepared[key]=keep
  }
  return{prepared,conflicts}
}
function resolveMergeInput(data){
  const analysis=prepareMergeInput(data);if(!analysis.conflicts.length){prepareImport(analysis.prepared,"merge");return}
  const labels={zones:"zone",vlans:"VLAN",equipmentTypes:"type d'équipement",serviceTypes:"type de service",protocols:"protocole",knownPorts:"port connu",users:"utilisateur",equipments:"équipement",services:"service",flows:"flux"};
  modal("Résoudre les conflits d'UUID",`<div class="errorbox">${analysis.conflicts.length} élément(s) portent le même UUID avec un contenu différent. Chaque décision est obligatoire.</div><div class="field"><label>Appliquer à tous</label><select id="bulkConflict"><option value="">— Choisir individuellement —</option><option value="current">Conserver les données courantes</option><option value="imported">Utiliser les données importées</option></select></div>${analysis.conflicts.map((c,i)=>`<div class="listitem"><b>${esc(labels[c.key]||c.key)} · ${esc(c.current.name||c.current.pseudo||c.id)}</b><br><span class="muted">UUID ${esc(c.id)}</span><div class="field"><label>Décision</label><select name="conflict-${i}" data-conflict-choice required><option value="">— Décision obligatoire —</option><option value="current">Conserver la donnée courante</option><option value="imported">Utiliser la donnée importée</option></select></div></div>`).join("")}`,fd=>{
    analysis.conflicts.forEach((c,i)=>{if(fd.get(`conflict-${i}`)==="current")analysis.prepared[c.key]=analysis.prepared[c.key].filter(x=>x.id!==c.id)});
    setTimeout(()=>prepareImport(analysis.prepared,"merge"),0)
  },{submit:"Continuer"});$("#bulkConflict").onchange=e=>{$$("[data-conflict-choice]",$("#modalBody")).forEach(s=>s.value=e.target.value)}
}
function confirmImportBackup(data,mode){
  try{download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),`${safeName(state.document.name)}-avant-import.json`)}
  catch(e){toast("La sauvegarde de sécurité n'a pas pu être créée. Import annulé.","error");return}
  modal("Confirmer la sauvegarde",`<p>La sauvegarde JSON du document courant a été proposée au téléchargement.</p><label><input type="checkbox" name="backupConfirmed" value="yes" required> J'ai vérifié que la sauvegarde a bien été téléchargée.</label><p class="muted">Sans cette confirmation, aucune donnée ne sera modifiée.</p>`,fd=>{if(fd.get("backupConfirmed")!=="yes")throw Error("Confirmez le téléchargement de la sauvegarde.");setTimeout(()=>chooseImportDestination(data,mode),0)},{submit:"Continuer"})
}
function importFile(file){const r=new FileReader();r.onload=()=>{try{const data=validateImport(JSON.parse(r.result));modal("Importer le document total",`<p><b>${esc(data.document.name)}</b></p><p>${data.equipments.length} équipements · ${data.services.length} services · ${data.flows.length} flux</p><div class="field"><label>Mode</label><select name="mode"><option value="replace">Remplacement total</option><option value="merge">Fusion</option></select></div>`,fd=>{const mode=fd.get("mode");setTimeout(()=>mode==="merge"?resolveMergeInput(data):prepareImport(data,mode),0)},{submit:"Afficher l'aperçu"})}catch(e){showImportError(e)}};r.onerror=()=>toast("Impossible de lire le fichier sélectionné.","error");r.readAsText(file)}
function chooseImportDestination(data,mode){
  if(!fileHandle){finalizeImport(data,mode,"detached");return}
  modal("Destination du document importé",`<p>Un fichier local est actuellement associé à l'application. Choisissez la destination avant toute écriture.</p><div class="field"><label>Destination</label><select name="destination"><option value="current">Écrire dans le fichier actuellement ouvert</option><option value="new">Enregistrer dans un nouveau fichier</option><option value="detached">Détacher le fichier et travailler sans sauvegarde directe</option></select></div>`,fd=>setTimeout(()=>finalizeImport(data,mode,fd.get("destination")),0),{submit:"Appliquer"})
}
function buildImportCandidate(data,mode){
  if(mode==="replace")return clone(data);
  const candidate=clone(state),before=clone(state),incoming=clone(data);
  for(const key of ["zones","vlans","equipmentTypes","serviceTypes","protocols","knownPorts","users","equipments","services","flows"]){const target=candidate[key],existing=new Map(target.map((x,i)=>[x.id,i]));for(const x of incoming[key]||[]){const at=existing.get(x.id);if(at!==undefined){target[at]=clone(x);continue}let c=clone(x);if("name"in c){const scope=y=>key==="services"?y.equipmentId===c.equipmentId:key==="vlans"?y.zoneId===c.zoneId:true;if(target.some(y=>scope(y)&&norm(y.name)===norm(c.name)))c.name=nextName(c.name,target,scope)}target.push(c)}}
  candidate.document.revision++;candidate.document.parentHash=hashText(JSON.stringify(before));candidate.document.updatedAt=now();return validateImport(candidate)
}
function publishImport(candidate,mode,backup,handle=null){
  state=candidate;currentUserId=null;fileHandle=handle;lastExternal=handle?{id:state.document.id,revision:state.document.revision,hash:hashText(JSON.stringify(state))}:null;undoState={label:mode==="replace"?"remplacement total":"fusion",state:backup};dirty=!handle;scheduleRecovery();render();setSave(handle?"Enregistré":"Non sauvegardé");ensureUser();toast(mode==="replace"?"Document remplacé.":"Fusion appliquée.","ok")
}
async function finalizeImport(data,mode,destination){
  const backup=clone(state);
  try{
    const candidate=buildImportCandidate(data,mode);
    if(destination==="detached"){publishImport(candidate,mode,backup,null);return}
    let handle=fileHandle;if(destination==="new")handle=await showSaveFilePicker({suggestedName:`${safeName(candidate.document.name)}.json`,types:[{description:"Document Matrix",accept:{"application/json":[".json"]}}]});
    if(destination==="current"&&lastExternal){const snapshot=await externalSnapshot(handle);if(snapshot.hash!==lastExternal.hash)throw Error("le fichier associé a été modifié ailleurs ; rechargez-le ou choisissez un nouveau fichier")}
    setSave("Enregistrement");const w=await handle.createWritable();await w.write(JSON.stringify(candidate,null,2));await w.close();publishImport(candidate,mode,backup,handle)
  }catch(e){setSave(fileHandle?"Enregistré":"Non sauvegardé");if(e.name!=="AbortError"){if(e.validationErrors)showImportError(e);else toast("Import annulé, aucune donnée modifiée : "+e.message,"error")}}
}
function replaceImport(data){finalizeImport(data,"replace","detached")}
function mergeImport(data){finalizeImport(data,"merge","detached")}
function regenerateIds(doc){const d=clone(doc),map=new Map();const collections=["users","zones","vlans","equipmentTypes","serviceTypes","protocols","knownPorts","equipments","services","flows"];for(const key of collections)for(const x of d[key])if(!x.builtin){const n=uid();map.set(x.id,n);x.id=n}for(const e of d.equipments){for(const i of e.interfaces){const ni=uid();map.set(i.id,ni);i.id=ni;for(const ip of i.ips){const n=uid();map.set(ip.id,n);ip.id=n}for(const dns of i.dns){const n=uid();map.set(dns.id,n);dns.id=n;dns.ipIds=(dns.ipIds||[]).map(x=>map.get(x)||x)}for(const h of e.history||[])h.id=uid()}}for(const s of d.services){s.equipmentId=map.get(s.equipmentId)||s.equipmentId;for(const l of s.listeners||[]){const old=l.id,n=uid();map.set(old,n);l.id=n;l.refId=map.get(l.refId)||l.refId}for(const h of s.history||[])h.id=uid()}for(const e of d.equipments){e.typeId=map.get(e.typeId)||e.typeId;e.zoneId=map.get(e.zoneId)||e.zoneId}for(const v of d.vlans)v.zoneId=map.get(v.zoneId)||v.zoneId;for(const p of d.knownPorts)p.protocolId=map.get(p.protocolId)||p.protocolId;for(const f of d.flows){f.protocolId=map.get(f.protocolId)||f.protocolId;f.endpoints.forEach(ep=>{ep.serviceId=map.get(ep.serviceId)||ep.serviceId;ep.listenerId=map.get(ep.listenerId)||ep.listenerId})}d.document.id=uid();d.document.revision=0;d.document.parentHash=null;return d}
function createIndependentCopy(){confirmAction("Créer une copie indépendante","Tous les UUID métier seront renouvelés.",()=>{state=regenerateIds(state);currentUserId=null;fileHandle=null;lastExternal=null;dirty=true;scheduleRecovery();render();ensureUser();toast("Copie indépendante créée.","ok")})}
function resetApplication(){const backup=clone(state);download(new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),`${safeName(state.document.name)}-securite.json`);confirmAction("Réinitialiser l'application","La sauvegarde de sécurité vient d'être téléchargée. Confirmez-vous la réinitialisation ?",()=>{state=newDocument();currentUserId=null;fileHandle=null;lastExternal=null;undoState=null;localStorage.removeItem("matrix:prefs");recoveryClear().finally(()=>{render();ensureUser();toast("Application réinitialisée.","ok")})})}
function undoLast(){if(!undoState)return;const previous=undoState;undoState=null;state=previous.state;state.document.revision++;state.document.updatedAt=now();dirty=true;scheduleRecovery();render();toast("Opération annulée.","ok")}
function savePrefs(){const p=loadPrefs();p.theme=document.documentElement.dataset.theme||"system";p.users=p.users||{};p.users[state.document.id]=currentUserId;localStorage.setItem("matrix:prefs",JSON.stringify(p))}
function loadPrefs(){try{return JSON.parse(localStorage.getItem("matrix:prefs"))||{}}catch{return{}}}
let recoveryTimer;function scheduleRecovery(){clearTimeout(recoveryTimer);recoveryTimer=setTimeout(()=>recoveryPut(state),250)}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open("matrix-recovery",1);r.onupgradeneeded=()=>r.result.createObjectStore("documents",{keyPath:"document.id"});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function recoveryPut(d){try{const db=await openDb(),tx=db.transaction("documents","readwrite");tx.objectStore("documents").put(clone(d));await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){console.warn(e)}}
async function recoveryList(){try{const db=await openDb(),tx=db.transaction("documents"),r=tx.objectStore("documents").getAll(),all=await new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return all}catch{return[]}}
async function recoveryDelete(documentId){try{const db=await openDb(),tx=db.transaction("documents","readwrite");tx.objectStore("documents").delete(documentId);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){throw Error("Impossible de supprimer cette récupération : "+e.message)}}
async function recoveryClear(){try{const db=await openDb(),tx=db.transaction("documents","readwrite");tx.objectStore("documents").clear();return new Promise(res=>tx.oncomplete=res)}catch{}}
async function renderRecoveryPanel(root=$("#view-data")){
  const panel=$("#recoveryPanel",root);if(!panel)return;
  const list=(await recoveryList()).sort((a,b)=>String(b.document?.updatedAt||"").localeCompare(String(a.document?.updatedAt||"")));
  if(!panel.isConnected)return;
  panel.innerHTML=list.length?list.map(d=>`<div class="listitem"><div class="row"><div><b>${esc(d.document?.name||"Document sans nom")}</b><br><span class="muted">${fmtDate(d.document?.updatedAt)} · révision ${Number(d.document?.revision)||0}<br>UUID ${esc(d.document?.id||"inconnu")}</span></div><div class="actions"><button class="btn small primary" data-recovery-restore="${esc(d.document?.id)}">Restaurer</button><button class="btn small danger" data-recovery-delete="${esc(d.document?.id)}">Supprimer</button></div></div>${d.document?.id===state.document.id?'<span class="badge">Document courant</span>':""}</div>`).join(""):'<p class="muted">Aucune récupération locale.</p>';
  $$("[data-recovery-restore]",panel).forEach(b=>b.onclick=()=>restoreRecovery(b.dataset.recoveryRestore));
  $$("[data-recovery-delete]",panel).forEach(b=>b.onclick=()=>deleteRecovery(b.dataset.recoveryDelete));
}
async function restoreRecovery(documentId){
  const recovered=(await recoveryList()).find(d=>d.document?.id===documentId);if(!recovered){toast("Cette récupération n'existe plus.","error");renderRecoveryPanel();return}
  try{validateImport(recovered)}catch(e){toast("Récupération invalide : "+e.message,"error");return}
  confirmAction("Restaurer la récupération",`Remplacer le document courant par <b>${esc(recovered.document.name)}</b>, révision ${Number(recovered.document.revision)||0} ? Une sauvegarde JSON du document courant sera téléchargée avant le remplacement.`,()=>{
    const backup=clone(state);download(new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),`${safeName(state.document.name)}-avant-recuperation.json`);
    state=clone(recovered);currentUserId=null;fileHandle=null;lastExternal=null;undoState={label:"restauration locale",state:backup};dirty=true;scheduleRecovery();render();ensureUser();toast("Récupération restaurée.","ok")
  })
}
function deleteRecovery(documentId){
  const isCurrent=documentId===state.document.id;confirmAction("Supprimer la récupération",`${isCurrent?"Cette copie concerne le document courant. ":""}Supprimer définitivement cette récupération locale du navigateur ?`,async()=>{try{await recoveryDelete(documentId);toast("Récupération supprimée.","ok");renderRecoveryPanel()}catch(e){toast(e.message,"error")}})
}
async function ensureUser(){const prefs=loadPrefs(),remembered=prefs.users?.[state.document.id];if(remembered&&state.users.some(x=>x.id===remembered))currentUserId=remembered;if(!currentUser()&&state.users.length){modal("Choisir l'utilisateur",`<div class="field"><label>Utilisateur courant</label><select name="userId">${options(state.users,"",x=>`${x.pseudo} — ${x.label}`)}</select></div>`,fd=>{const id=fd.get("userId");if(!id)throw Error("Sélectionnez un utilisateur.");selectUser(id)},{submit:"Continuer"})}else if(!state.users.length)openUserForm(null,true);render()}
$("#docName").addEventListener("change",e=>{const name=e.target.value.trim();if(!name){e.target.value=state.document.name;return}transact("Document renommé",()=>state.document.name=name)});
$("#themeButton").onclick=()=>{const cur=document.documentElement.dataset.theme||"light",next=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=next;savePrefs()};
$("#userButton").onclick=()=>setView("users");
$$("nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("#fileInput").onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=""};
$("#modal").addEventListener("cancel",e=>{if(!state.users.length){e.preventDefault();toast("Un utilisateur est obligatoire.","error")}});
const pref=loadPrefs();let theme=pref.theme;if(!theme||theme==="system")theme=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=theme;
render();ensureUser();recoveryList().then(list=>{const others=list.filter(x=>x.document.id!==state.document.id);if(others.length)toast(`${others.length} récupération(s) disponible(s) dans Données.`)});
</script>
</body>
